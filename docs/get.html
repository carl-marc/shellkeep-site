<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a1a">
  <title>Get Shellkeep</title>
  <meta property="og:title" content="Get Shellkeep">
  <meta property="og:description" content="Collect, merge and trade cards. Download Shellkeep for iOS and Android.">
  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #555;
      --accent: #6750a4;
      --bg: #fafafa;
      --panel: #f1f0f5;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f1f1f1; --muted: #b0b0b0; --bg: #121212; --panel: #1f1d24; }
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 64px 24px;
      text-align: center;
      line-height: 1.5;
    }
    h1 { font-size: 28px; margin: 0 0 12px; }
    p { color: var(--muted); margin: 8px 0; }
    .stores { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 28px; }
    .stores a {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }
    .stores img { height: 52px; }
    .stores #playstore img { height: 76px; }
    .hidden { display: none; }
    .home-link { color: var(--accent); }
  </style>
</head>
<body>
  <main id="redirecting">
    <h1>Opening the store…</h1>
    <p>If nothing happens, pick your platform below.</p>
  </main>

  <main id="picker" class="hidden">
    <h1>Get Shellkeep</h1>
    <p>Collect, merge and trade cards. Choose your platform:</p>
    <div class="stores">
      <a href="https://apps.apple.com/app/id6757331713" id="appstore">
        <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store">
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.hamlab.glyphcards" id="playstore">
        <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
      </a>
    </div>
  </main>

  <script>
    (function () {
      var APP_STORE = 'https://apps.apple.com/app/id6757331713';
      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.hamlab.glyphcards';

      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua) ||
        (/Mac/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);

      if (isIOS) {
        location.replace(APP_STORE);
        return;
      }
      if (isAndroid) {
        location.replace(PLAY_STORE);
        return;
      }

      // Unknown platform (desktop, in-app browsers we can't classify) — show picker.
      document.getElementById('redirecting').classList.add('hidden');
      document.getElementById('picker').classList.remove('hidden');
    })();
  </script>
</body>
</html>
